<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload file</title>
  <!-- Bootstrap local -->
  <link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
  <!-- MSAL -->
  <script src="https://alcdn.msauth.net/browser/2.37.0/js/msal-browser.min.js"></script>
</head>

<body class="bg-body-tertiary">

  <div class="container mt-5">
    <h1 class="text-center mb-4">Document Upload</h1>
    <h5 class="text-center text-muted mb-4">Cosmetic Surgery BCN</h5>

    <div class="row">
      <div class="col-md-6 mx-auto">

        <div class="mb-3">
          <label for="fileInput" class="form-label">Select file</label>
          <input class="form-control" type="file" id="fileInput">
        </div>

        <div class="mb-3">
          <label for="metadataInput" class="form-label">
            Select metadata JSON
          </label>

          <input class="form-control" type="file" id="metadataInput" accept=".json">
        </div>

        <div class="mb-3">
          <label for="containerSelect" class="form-label">Select container</label>
          <select class="form-select" id="containerSelect">
            {% if containers %}
            {% for container in containers %}
            <option value="{{ container }}">{{ container }}</option>
            {% endfor %}
            {% else %}
            <option value="">No containers available</option>
            {% endif %}
          </select>
        </div>
        <div class="mb-3">
          <label for="prefixSelect" class="form-label">Select folder (optional)</label>
          <select class="form-select" id="prefixSelect">
            <option value="">Root</option>
          </select>
        </div>
        <button id="loginBtn" class="btn w-100 mb-3" style="background-color:#0078D4; color:white;">
          Login with Microsoft
        </button>

        <button id="uploadBtn" class="btn btn-success w-100">
          Upload file
        </button>

        <!-- Barra de progreso y mensajes -->
        <div id="progressContainer" class="progress d-none mt-3">
          <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%">0%</div>
        </div>

        <div id="successMsg" class="alert alert-success d-none mt-3">File ready to upload</div>
        <div id="errorMsg" class="alert alert-danger d-none mt-3">Error when selecting file</div>

      </div>
    </div>
  </div>
  <script>
    const msalConfig = {
      auth: {
        clientId: "{{azure_client_id}}",
        authority: "https://login.microsoftonline.com/{{azure_tenant_id}}",
        redirectUri: window.location.origin
      },
      cache: {
        cacheLocation: "localStorage",
        storeAuthStateInCookie: false
      }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);
    let accessToken = null;

    document.getElementById("loginBtn").addEventListener("click", async () => {
      try {
        const loginResponse = await msalInstance.loginPopup({
          scopes: ["User.Read"]
        });

        const account = loginResponse.account;

        const tokenResponse = await msalInstance.acquireTokenSilent({
          scopes: ["User.Read"],
          account: account
        });

        accessToken = tokenResponse.accessToken;

        alert("Login successful");
      } catch (error) {
        console.error(error);
        alert("Login failed");
      }
    });
  </script>
  <script>
    const containerSelect = document.getElementById("containerSelect");
    const prefixSelect = document.getElementById("prefixSelect");

    async function loadPrefixes(container) {
      // Reset dropdown
      prefixSelect.innerHTML = '<option value="">Root</option>';

      if (!container) return;

      try {
        const response = await fetch(
          `/upload/prefixes?container_name=${encodeURIComponent(container)}`
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Error loading prefixes");
        }

        data.prefixes.forEach(prefix => {
          const option = document.createElement("option");
          option.value = prefix;
          option.textContent = prefix;
          prefixSelect.appendChild(option);
        });

      } catch (error) {
        console.error("Error fetching prefixes:", error);
      }
    }

    // Cuando cambia el contenedor
    containerSelect.addEventListener("change", function () {
      const container = this.value;
      loadPrefixes(container);
    });

    // 👇 Ejecutar automáticamente al cargar la página
    window.addEventListener("DOMContentLoaded", () => {
      if (containerSelect.value) {
        loadPrefixes(containerSelect.value);
      }
    });
  </script>
  <script>
    document.getElementById("uploadBtn").addEventListener("click", async () => {

      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];

      const metadataInput =
        document.getElementById("metadataInput");

      const metadataFile =
        metadataInput.files[0];

      if (!metadataFile) {
        errorMsg.textContent =
          "No metadata JSON selected";

        errorMsg.classList.remove("d-none");
        return;
      }
      const container = document.getElementById("containerSelect").value;
      const prefix = document.getElementById("prefixSelect").value;

      const progressContainer = document.getElementById("progressContainer");
      const progressBar = document.getElementById("progressBar");
      const successMsg = document.getElementById("successMsg");
      const errorMsg = document.getElementById("errorMsg");

      successMsg.classList.add("d-none");
      errorMsg.classList.add("d-none");

      if (!file) {
        errorMsg.textContent = "No file selected";
        errorMsg.classList.remove("d-none");
        return;
      }

      progressContainer.classList.remove("d-none");
      progressBar.style.width = "0%";
      progressBar.textContent = "0%";

      // FormData
      const formData = new FormData();
      formData.append("file", file);
      formData.append("container_name", container);

      // 👇 enviar prefix
      if (prefix) {
        formData.append("prefix", prefix);
      }

      try {

        if (!accessToken) {
          errorMsg.textContent = "You must login first";
          errorMsg.classList.remove("d-none");
          return;
        }

        const metadataText =
          await metadataFile.text();

        const metadata =
          JSON.parse(metadataText);

        // 👇 enviar metadata
        formData.append(
          "metadata",
          JSON.stringify(metadata)
        );

        const response = await fetch("/upload/to-azure", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${accessToken}`
          },
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          progressBar.style.width = "100%";
          progressBar.textContent = "100%";

          successMsg.textContent = `Archivo '${data.filename}' subido correctamente`;
          successMsg.classList.remove("d-none");

        } else {
          throw new Error(data.detail || "Error subiendo archivo");
        }

      } catch (err) {
        console.error(err);
        errorMsg.textContent = err.message || "Error subiendo archivo";
        errorMsg.classList.remove("d-none");
      }

    });
  </script>

  <script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>

</html>
