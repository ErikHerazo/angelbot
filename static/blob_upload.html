<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subir archivo</title>

  <!-- Bootstrap local -->
  <link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
</head>

<body class="bg-body-tertiary">

  <div class="container mt-5">

    <h1 class="text-center mb-4">
      Document Upload
    </h1>

    <h5 class="text-center text-muted mb-4">
      Cosmetic Surgery BCN
    </h5>

    <div class="row">
      <div class="col-md-6 mx-auto">

        <div class="mb-3">
          <label for="fileInput" class="form-label">Select file</label>
          <input class="form-control" type="file" id="fileInput">
        </div>

        <button id="uploadBtn" class="btn btn-primary w-100">
          Upload File
        </button>

      </div>
    </div>

  </div>

  <!-- Azure SDK (solo si subes directo desde frontend) -->
  <script src="https://unpkg.com/@azure/storage-blob/dist/browser/azure-storage-blob.min.js"></script>

  <script>
    const { BlobServiceClient } = azblob;

    document.getElementById("uploadBtn").addEventListener("click", uploadFile);

    async function uploadFile() {
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];

      if (!file) {
        fileInput.classList.add("is-invalid");
        return;
      }

      fileInput.classList.remove("is-invalid");

      const uploadBtn = document.getElementById("uploadBtn");
      const progressBar = document.getElementById("progressBar");
      const progressContainer = document.getElementById("progressContainer");
      const successMsg = document.getElementById("successMsg");
      const errorMsg = document.getElementById("errorMsg");

      successMsg.classList.add("d-none");
      errorMsg.classList.add("d-none");
      uploadBtn.disabled = true;
      progressContainer.classList.remove("d-none");

      try {
        // 1️⃣ Pedir SAS a tu backend
        const response = await fetch(`/generate-sas?filename=${file.name}`);
        const data = await response.json();

        const sasUrl = `https://${data.account}.blob.core.windows.net/?${data.sas_token}`;

        const blobServiceClient = new BlobServiceClient(sasUrl);
        const containerClient = blobServiceClient.getContainerClient(data.container);
        const blockBlobClient = containerClient.getBlockBlobClient(file.name);

        // 2️⃣ Subir directo a Azure
        await blockBlobClient.uploadBrowserData(file, {
          onProgress: (ev) => {
            const percent = Math.round((ev.loadedBytes / file.size) * 100);
            progressBar.style.width = percent + "%";
            progressBar.textContent = percent + "%";
          }
        });

        successMsg.classList.remove("d-none");

      } catch (err) {
        console.error(err);
        errorMsg.classList.remove("d-none");
      }

      uploadBtn.disabled = false;
    }
  </script>

  <!-- Bootstrap JS local -->
  <script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>

</html>
